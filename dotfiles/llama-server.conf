# Llama.cpp Server Configuration Preset

# Ruta al modelo GGUF que querés usar
# MODEL_PATH="$HOME/models/qwen2.5-3b-instruct-q4_k_m.gguf"
MODEL_PATH="$HOME/models/qwen3.5-4b-super-coder-q4_0.gguf"
# MODEL_PATH="$HOME/models/gemma-4-e2b-it-opus-q4_k_m.gguf"

# Puerto en el que va a escuchar el servidor
PORT=8080

# Hilos de CPU (núcleos físicos de tu Ryzen 7 5700U)
THREADS=8

# Capas a subir a la GPU mediante Vulkan (99 sube todo)
GPU_LAYERS=99

# Tamaño de contexto (16384 es el balance óptimo para no saturar tus 13 GB de RAM)
CTX_SIZE=16384
