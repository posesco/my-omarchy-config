#!/usr/bin/env bash

# ==============================================================================
# Model Registry
# ==============================================================================
# Each model entry defines:
#   MODEL_IDS[]       - Unique identifier
#   MODEL_NAMES[]     - Human-readable name shown in the wizard
#   MODEL_SIZES[]     - Approximate size for display
#   MODEL_CATEGORIES[]- Category: llm | voice
#   MODEL_DESTPATHS[] - Destination path relative to $HOME
#   MODEL_COMMANDS[]  - Download command (uses $DEST as the final file/dir path)
# ==============================================================================

MODELS_DIR="${HOME}/models"

declare -a MODEL_IDS
declare -A MODEL_NAMES
declare -A MODEL_SIZES
declare -A MODEL_CATEGORIES
declare -A MODEL_DESTPATHS
declare -A MODEL_COMMANDS

# --- LLM Models (GGUF) ---

MODEL_IDS+=("qwen2.5-3b-instruct")
MODEL_NAMES[qwen2.5-3b-instruct]="Qwen 2.5 3B Instruct (Q4_K_M)"
MODEL_SIZES[qwen2.5-3b-instruct]="~1.8 GB"
MODEL_CATEGORIES[qwen2.5-3b-instruct]="llm"
MODEL_DESTPATHS[qwen2.5-3b-instruct]="models/qwen2.5-3b-instruct-q4_k_m.gguf"
MODEL_COMMANDS[qwen2.5-3b-instruct]='huggingface-cli download Qwen/Qwen2.5-3B-Instruct-GGUF --include "qwen2.5-3b-instruct-q4_k_m.gguf" --local-dir "${MODELS_DIR}" --local-dir-use-symlinks false'

MODEL_IDS+=("qwen3.5-4b-super-coder")
MODEL_NAMES[qwen3.5-4b-super-coder]="Qwen 3.5 4B Super Coder (Q4_0)"
MODEL_SIZES[qwen3.5-4b-super-coder]="~2.4 GB"
MODEL_CATEGORIES[qwen3.5-4b-super-coder]="llm"
MODEL_DESTPATHS[qwen3.5-4b-super-coder]="models/qwen3.5-4b-super-coder-q4_0.gguf"
MODEL_COMMANDS[qwen3.5-4b-super-coder]='huggingface-cli download jica98/qwen3.5-4B-super-coder --include "*.gguf" --local-dir "${MODELS_DIR}" --local-dir-use-symlinks false'

MODEL_IDS+=("gemma-4-e2b-opus")
MODEL_NAMES[gemma-4-e2b-opus]="Gemma 4 E2B Opus Reasoning (Q4_K_M)"
MODEL_SIZES[gemma-4-e2b-opus]="~3.2 GB"
MODEL_CATEGORIES[gemma-4-e2b-opus]="llm"
MODEL_DESTPATHS[gemma-4-e2b-opus]="models/gemma-4-e2b-it-opus-q4_k_m.gguf"
MODEL_COMMANDS[gemma-4-e2b-opus]='huggingface-cli download filipwx/gemma-4-E2B-it-Opus-4.6-Reasoning-GGUF --include "*Q4_K_M*" --local-dir "${MODELS_DIR}" --local-dir-use-symlinks false'

# --- Voice / ASR Models ---

MODEL_IDS+=("whisper-large-v3-turbo-q5")
MODEL_NAMES[whisper-large-v3-turbo-q5]="Whisper Large v3 Turbo (Q5)"
MODEL_SIZES[whisper-large-v3-turbo-q5]="~547 MB"
MODEL_CATEGORIES[whisper-large-v3-turbo-q5]="voice"
MODEL_DESTPATHS[whisper-large-v3-turbo-q5]="models/voice/whisper-large-v3-turbo-q5"
MODEL_COMMANDS[whisper-large-v3-turbo-q5]='huggingface-cli download ggerganov/whisper.cpp --include "ggml-large-v3-turbo-q5_0.bin" --local-dir "${MODELS_DIR}/voice/whisper-large-v3-turbo-q5" --local-dir-use-symlinks false'

MODEL_IDS+=("parakeet-tdt-0.6b")
MODEL_NAMES[parakeet-tdt-0.6b]="NeMo Parakeet TDT 0.6B (INT8, Sherpa-ONNX)"
MODEL_SIZES[parakeet-tdt-0.6b]="~465 MB"
MODEL_CATEGORIES[parakeet-tdt-0.6b]="voice"
MODEL_DESTPATHS[parakeet-tdt-0.6b]="models/voice/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"
MODEL_COMMANDS[parakeet-tdt-0.6b]='wget -qO- "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8.tar.bz2" | tar xjf - -C "${MODELS_DIR}/voice/"'

MODEL_IDS+=("nemotron-3.5-asr")
MODEL_NAMES[nemotron-3.5-asr]="Nemotron 3.5 ASR Streaming 0.6B (CPU, Sherpa-ONNX)"
MODEL_SIZES[nemotron-3.5-asr]="~600 MB"
MODEL_CATEGORIES[nemotron-3.5-asr]="voice"
MODEL_DESTPATHS[nemotron-3.5-asr]="models/voice/nemotron-3.5-asr-streaming-0.6b-generic-cpu-3-v3"
MODEL_COMMANDS[nemotron-3.5-asr]='huggingface-cli download csukuangfj/sherpa-onnx-nemo-fast-conformer-transducer-es-1424-cpu-int8 --local-dir "${MODELS_DIR}/voice/nemotron-3.5-asr-streaming-0.6b-generic-cpu-3-v3" --local-dir-use-symlinks false'

MODEL_IDS+=("zipformer-es-kroko")
MODEL_NAMES[zipformer-es-kroko]="Zipformer Streaming ES Kroko (Sherpa-ONNX)"
MODEL_SIZES[zipformer-es-kroko]="~80 MB"
MODEL_CATEGORIES[zipformer-es-kroko]="voice"
MODEL_DESTPATHS[zipformer-es-kroko]="models/voice/sherpa-onnx-streaming-zipformer-es-kroko-2025-08-06"
MODEL_COMMANDS[zipformer-es-kroko]='huggingface-cli download csukuangfj/sherpa-onnx-streaming-zipformer-es-kroko-2025-08-06 --local-dir "${MODELS_DIR}/voice/sherpa-onnx-streaming-zipformer-es-kroko-2025-08-06" --local-dir-use-symlinks false'

MODEL_IDS+=("vosk-small-es")
MODEL_NAMES[vosk-small-es]="Vosk Small ES 0.42 (Offline Spanish)"
MODEL_SIZES[vosk-small-es]="~39 MB"
MODEL_CATEGORIES[vosk-small-es]="voice"
MODEL_DESTPATHS[vosk-small-es]="models/voice/vosk-model-small-es-0.42"
MODEL_COMMANDS[vosk-small-es]='wget -qO /tmp/vosk-es.zip "https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip" && unzip -qo /tmp/vosk-es.zip -d "${MODELS_DIR}/voice/" && rm -f /tmp/vosk-es.zip'
